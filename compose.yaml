name: huachicol

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

services:
  docker-socket-proxy:
    image: nginx:1.30.4-alpine
    container_name: huachicol-docker-socket-proxy
    restart: unless-stopped
    user: "101:101"
    group_add:
      - ${DOCKER_GID:?}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./version-api/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging: *logging

  version-api:
    build: ./version-api
    container_name: huachicol-version-api
    restart: unless-stopped
    environment:
      ONTOY_SERVICE: huachicol
      ONTOY_COMPOSE_PROJECT: huachicol
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS}
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /etc/os-release:/host/etc/os-release:ro
    depends_on:
      - docker-socket-proxy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
    networks:
      - iieg-network
      - docker-api
    logging: *logging

  monitor-data-init:
    image: python:3.13-alpine
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - monitor_data:/data
    network_mode: none
    restart: "no"
    logging: *logging

  monitor:
    build: ./monitor
    container_name: huachicol-monitor
    restart: unless-stopped
    environment:
      MONITOR_TARGETS_FILE: /app/targets.json
      MONITOR_POLL_INTERVAL: ${MONITOR_POLL_INTERVAL:?}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:?}
      MONITOR_RECOVERY_THRESHOLD: ${MONITOR_RECOVERY_THRESHOLD:?}
      MONITOR_HISTORY_RETENTION_DAYS: ${MONITOR_HISTORY_RETENTION_DAYS:?}
      MONITOR_REMINDER_HOURS: ${MONITOR_REMINDER_HOURS:?}
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:?}
      MONITOR_DEPLOY_TIMEOUT: ${MONITOR_DEPLOY_TIMEOUT:?}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID?}
    secrets:
      - discord_webhook_url
      - telegram_bot_token
      - monitor_deadman_url
      - monitor_deploy_token
    group_add:
      - "${MONITOR_SECRETS_GID:?}"
    volumes:
      - ./monitor/targets.json:/app/targets.json:ro
      - monitor_data:/data
    depends_on:
      monitor-data-init:
        condition: service_completed_successfully
    networks:
      - iieg-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      timeout: 20s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  iieg-network:
    external: true
  docker-api:
    name: huachicol-docker-api
    internal: true

volumes:
  monitor_data:

secrets:
  discord_webhook_url:
    file: ./secrets/discord_webhook_url
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  monitor_deadman_url:
    file: ./secrets/monitor_deadman_url
  monitor_deploy_token:
    file: ./secrets/monitor_deploy_token
