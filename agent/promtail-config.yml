server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml
  sync_period: 10s

clients:
  - url: ${LOKI_URL}/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          server: ${SERVER_NAME}
          __path__: /var/lib/docker/containers/**/*-json.log

    pipeline_stages:
      - docker: {}

      - label_extract:
          container_name:

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          server: ${SERVER_NAME}
          __path__: /var/log/syslog
