groups:
  - name: service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "El servicio {{ $labels.job }} no responde."
          description: "{{ $labels.job }} ({{ $labels.instance }}) lleva más de 5 minutos sin responder al scrape de Prometheus."

      - alert: HighLatency
        expr: |
          (
            rate(http_request_duration_seconds_sum{project!="mariachi"}[5m])
            /
            rate(http_request_duration_seconds_count{project!="mariachi"}[5m])
          ) > 1
          and rate(http_request_duration_seconds_count{project!="mariachi"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia promedio por encima de 1s en {{ $labels.project }}."
          description: "La latencia promedio de los últimos 5 min es {{ $value | humanize }}s en {{ $labels.project }}."

      - alert: HighLatencyMariachi
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, project) (rate(http_request_duration_seconds_bucket{project="mariachi"}[10m]))
          ) > 3
          and on (project)
          sum by (project) (rate(http_request_duration_seconds_count{project="mariachi"}[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          project: mariachi
        annotations:
          summary: "Latencia p95 por encima de 3s en mariachi (CMS admin)."
          description: "El percentil 95 de los últimos 10 min es {{ $value | humanize }}s con al menos 0.1 req/s sostenidos durante 15 min. Mariachi es panel administrativo de baja frecuencia y tolera picos legítimos (GeoServer, DataEngine, Acervo); esta alerta solo dispara fuera de ese rango."

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status_code=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.05
          and rate(http_requests_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de errores 5xx por encima del 5% en {{ $labels.project }}."
          description: "La tasa de errores 5xx es {{ $value | humanizePercentage }} en {{ $labels.project }}."

      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria por encima del 90% en {{ $labels.instance }}."
          description: "El uso de memoria de {{ $labels.instance }} lleva más de 5 minutos por encima del 90%."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espacio disponible en disco por debajo del 10% en {{ $labels.instance }}."
          description: "La partición raíz de {{ $labels.instance }} tiene menos del 10% de espacio libre."

  - name: ecosystem_integration_alerts
    interval: 30s
    rules:
      - alert: MariachiTreeNotifyFailures
        expr: increase(mariachi_tree_notify_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          service: mariachi
        annotations:
          summary: "Mariachi no logra notificar refresh-cache a mapalab."
          description: "El contador mariachi_tree_notify_failed_total se incrementó en los últimos 10 min. Causas habituales: MAPALAB_INTERNAL_TOKEN distinto en mariachi/.env y mapalab/.env, mapalab-backend caído, o red iieg-network rota. El tree de capas queda stale hasta el cron 04:00 UTC."

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL no responde en {{ $labels.instance }}."
          description: "El exporter no logra conectarse a PostgreSQL en {{ $labels.instance }} desde hace más de 1 minuto."

      - alert: TooManyConnections
        expr: |
          sum by (instance) (pg_stat_activity_count)
          / sum by (instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "Conexiones a PostgreSQL por encima del 80% del máximo en {{ $labels.instance }}."
          description: "Las conexiones activas son {{ $value | humanizePercentage }} del máximo configurado en {{ $labels.instance }}."

  - name: monitoring_stack_alerts
    interval: 30s
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
          service: loki
        annotations:
          summary: "Loki no responde."
          description: "El servicio de agregación de logs Loki no es alcanzable desde Prometheus."

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: "Grafana no responde."
          description: "El servicio de dashboards Grafana no es alcanzable desde Prometheus."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
          service: alertmanager
        annotations:
          summary: "Alertmanager no responde."
          description: "Alertmanager no es alcanzable; las alertas no podrán entregarse hasta que se restablezca."

      - alert: PrometheusStorageHigh
        expr: |
          (prometheus_tsdb_storage_size_bytes / (node_filesystem_size_bytes{mountpoint="/"}) > 0.3)
        for: 10m
        labels:
          severity: warning
          service: prometheus
        annotations:
          summary: "Almacenamiento de Prometheus por encima del 30% del disco."
          description: "El TSDB de Prometheus está utilizando más del 30% del espacio en disco de la raíz."

      - alert: PrometheusTargetScrapeFailure
        expr: increase(prometheus_target_scrapes_exceeded_sample_limit_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: prometheus
        annotations:
          summary: "Targets de Prometheus excediendo el límite de muestras."
          description: "Algunos targets están superando el límite de muestras configurado en los últimos 5 minutos."

      - alert: LokiHighIngestionRate
        expr: |
          rate(loki_distributor_bytes_received_total[5m]) > 10485760
        for: 5m
        labels:
          severity: warning
          service: loki
        annotations:
          summary: "Ingesta de logs en Loki por encima de 10 MB/s."
          description: "Loki está recibiendo más de 10 MB/s de logs durante los últimos 5 minutos."
