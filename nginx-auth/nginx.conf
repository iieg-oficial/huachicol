worker_processes 1;

events {
    worker_connections 256;
}

http {
    # DNS embebido de Docker: resuelve los upstreams en cada request en vez de
    # cachearlos al arrancar. Sin esto, recrear prometheus o loki cambia su IP
    # y nginx-auth responde 502 hasta que se reinicia a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Prometheus con auth
    server {
        listen 9091;

        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
            auth_basic off;
        }

        location / {
            auth_basic "Prometheus";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $prometheus_upstream http://prometheus:9090;
            proxy_pass $prometheus_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Loki con auth
    server {
        listen 3101;

        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
            auth_basic off;
        }

        location / {
            auth_basic "Loki";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $loki_upstream http://loki:3100;
            proxy_pass $loki_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
