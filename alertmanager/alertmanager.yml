global:
  resolve_timeout: 5m
  slack_api_url: 'https://discordapp.com/api/webhooks/1486102999020605641/SdF9Ld9QbzMAyj0ZXIF1YZC7SERlC3KioLNZhAfPG4XfSTrmk-eQc4vfEFtq-ksrEcnr/slack'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'discord'
  routes:
    - match:
        severity: critical
      receiver: 'discord'
    - match:
        severity: warning
      receiver: 'discord'

receivers:
  - name: 'discord'
    slack_configs:
      - title: '{{ if eq .Status "firing" }}ALERTA {{ .CommonLabels.severity | toUpper }}{{ else }}RESUELTA{{ end }}'
        text: |-
          {{ range .Alerts }}
          *Alerta:* {{ .Labels.alertname }}
          *Servicio:* {{ .Labels.service }}
          *Severidad:* {{ .Labels.severity }}
          *Descripcion:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
