name: huachicol-agent

services:
  alloy:
    image: grafana/alloy:v1.16.1
    container_name: huachicol-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL}
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    profiles:
      - all
      - telemetry

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: huachicol-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '-prometheus_endpoint=/huachicol'
      - '-store_container_labels=true'
      - '-housekeeping_interval=30s'
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    profiles:
      - all
      - cadvisor

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: huachicol-postgres-exporter
    restart: unless-stopped
    command:
      - '--web.telemetry-path=/huachicol'
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_DSN:-}
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      default:
      iieg-network:
        aliases:
          - postgres-exporter
      dataengine-network:
    profiles:
      - postgres

networks:
  iieg-network:
    external: true
    name: iieg-network
  dataengine-network:
    external: true
    name: dataengine-network

volumes:
  alloy_data:
