global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'iieg'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # --- Stack de monitoreo (siempre activos) ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'grafana'
    metrics_path: /huachicol/metrics
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # --- Proyectos (generados desde .env por generate-targets.sh) ---
  - job_name: 'projects'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/projects.json'
        refresh_interval: 30s

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    bearer_token_file: /etc/prometheus/targets/minio-token
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/minio.json'
        refresh_interval: 30s

  # --- Metricas de host (node-exporter) por servidor ---
  - job_name: 'node-exporter'
    metrics_path: /huachicol
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node-exporter.json'
        refresh_interval: 30s

  # --- Metricas de contenedores (cAdvisor) por servidor ---
  - job_name: 'cadvisor'
    metrics_path: /huachicol
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/cadvisor.json'
        refresh_interval: 30s

  # --- PostgreSQL (postgres-exporter del agente) ---
  - job_name: 'postgres-exporter'
    metrics_path: /huachicol
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/postgres-exporter.json'
        refresh_interval: 30s
