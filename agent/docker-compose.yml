name: huachicol-agent

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: huachicol-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.telemetry-path=/huachicol'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    profiles:
      - all
      - node

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: huachicol-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '-prometheus_endpoint=/huachicol'
      - '-docker_only=true'
      - '-store_container_labels=true'
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    profiles:
      - all
      - cadvisor

  promtail:
    image: grafana/promtail:3.4.2
    container_name: huachicol-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL}
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - promtail_positions:/data
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    profiles:
      - all
      - promtail

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: huachicol-postgres-exporter
    restart: unless-stopped
    command:
      - '--web.telemetry-path=/huachicol'
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_DSN:-}
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      - default
      - iieg-network
      - dataengine-network
    profiles:
      - postgres

networks:
  iieg-network:
    external: true
    name: iieg-network
  dataengine-network:
    external: true
    name: dataengine-network

volumes:
  promtail_positions:
