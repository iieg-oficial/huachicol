server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          server: ${SERVER_NAME}
          __path__: /var/lib/docker/containers/**/*-json.log

    pipeline_stages:
      - docker: {}

      - label_extract:
          container_name:

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          server: ${SERVER_NAME}
          __path__: /var/log/syslog
