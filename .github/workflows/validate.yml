name: Validate Configuration

on:
  push:
    branches: [production, develop]
  pull_request:
    branches: [production, develop]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create dummy .env for validation
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=placeholder/; s/^([A-Z_]+)=<[^>]*>$/\1=placeholder/' .env.example > .env
          # Variables cuyo valor el compose valida por formato: un placeholder generico no sirve
          sed -i -E 's|^MONITOR_BIND_ADDR=.*|MONITOR_BIND_ADDR=127.0.0.1|; s|^ONTOY_DISK_PATH=.*|ONTOY_DISK_PATH=/|' .env

      - name: Validate main compose
        run: docker compose config --quiet

  test-monitor:
    name: Test Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run unit tests
        working-directory: monitor
        run: python -m unittest discover -s tests -v

      - name: Validate targets.example.json
        run: python -c "import json; json.load(open('monitor/targets.example.json'))"
