groups:
  - name: service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Servicio {{ $labels.job }} caido"
          description: "{{ $labels.job }} ({{ $labels.instance }}) lleva mas de 1 minuto sin responder."

      - alert: HighLatency
        expr: |
          rate(http_request_duration_seconds_sum[5m])
          /
          rate(http_request_duration_seconds_count[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta en {{ $labels.project }}"
          description: "La latencia promedio es {{ $value }}s en {{ $labels.project }}."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status_code=~"5.."}[5m])
          /
          rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de errores alta en {{ $labels.project }}"
          description: "La tasa de errores 5xx es {{ $value | humanizePercentage }} en {{ $labels.project }}."

      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria alto en {{ $labels.instance }}"
          description: "El uso de memoria supera el 90% en {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espacio en disco bajo en {{ $labels.instance }}"
          description: "El espacio disponible en disco es menor al 10% en {{ $labels.instance }}."

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL caido"
          description: "PostgreSQL en {{ $labels.instance }} no responde."

      - alert: TooManyConnections
        expr: |
          sum by (instance) (pg_stat_activity_count)
          / sum by (instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Demasiadas conexiones en la base de datos"
          description: "Las conexiones estan al {{ $value | humanizePercentage }} del maximo en {{ $labels.instance }}."
