name: ${ONTOY_STACK_NAME:?}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  version-api:
    build: ./version-api
    image: iieg/ontoy-server:latest
    container_name: ${ONTOY_CONTAINER_NAME:?}
    restart: unless-stopped
    environment:
      ONTOY_SERVICE: ${ONTOY_SERVICE:?}
      ONTOY_COMPOSE_PROJECT: ${ONTOY_COMPOSE_PROJECT:?}
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      ONTOY_PORT_CHECKS: ${ONTOY_PORT_CHECKS:?}
      ONTOY_UPSTREAM_URL: ${ONTOY_UPSTREAM_URL}
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS}
      ONTOY_VERSION_FILE: ${ONTOY_VERSION_FILE:?}
      ONTOY_CHANGELOG_FILE: ${ONTOY_CHANGELOG_FILE:?}
    volumes:
      - ${ONTOY_VERSION_SOURCE:?}:${ONTOY_VERSION_FILE:?}:ro
      - ${ONTOY_CHANGELOG_SOURCE:?}:${ONTOY_CHANGELOG_FILE:?}:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/host/etc/os-release:ro
    ports:
      - "${ONTOY_BIND_ADDR:?}:${ONTOY_PORT:?}:8088"
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
    networks:
      - vigilado
    logging: *logging

networks:
  vigilado:
    name: ${ONTOY_NETWORK:?}
    external: true
