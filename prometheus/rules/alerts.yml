groups:
  - name: service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been down for more than 1 minute."

      - alert: HighLatency
        expr: |
          rate(http_request_duration_seconds_sum[5m])
          /
          rate(http_request_duration_seconds_count[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.project }}"
          description: "Average latency is {{ $value }}s for {{ $labels.project }}"

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status_code=~"5.."}[5m])
          /
          rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.project }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.project }}"

      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 10% on {{ $labels.instance }}"

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL on {{ $labels.instance }} is down"

      - alert: TooManyConnections
        expr: |
          sum by (instance) (pg_stat_activity_count)
          / sum by (instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many database connections"
          description: "Database connections are at {{ $value | humanizePercentage }} of max on {{ $labels.instance }}"

  - name: monitoring_stack_alerts
    interval: 30s
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"
          description: "Loki log aggregation service is unreachable"

      - alert: TempoDown
        expr: up{job="tempo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tempo is down"
          description: "Tempo tracing service is unreachable"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Grafana is down"
          description: "Grafana dashboard service is unreachable"

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager is unreachable - alerts will not be delivered"

      - alert: PrometheusStorageHigh
        expr: |
          (prometheus_tsdb_storage_size_bytes / (node_filesystem_size_bytes{mountpoint="/"}) > 0.3)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus storage consuming significant disk"
          description: "Prometheus TSDB is using more than 30% of disk space"

      - alert: PrometheusTargetScrapeFailure
        expr: increase(prometheus_target_scrapes_exceeded_sample_limit_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus scrape failures detected"
          description: "Some targets are exceeding sample limits"

      - alert: LokiHighIngestionRate
        expr: |
          rate(loki_distributor_bytes_received_total[5m]) > 10485760
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki ingestion rate is high"
          description: "Loki is receiving more than 10MB/s of logs"
